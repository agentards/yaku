# Yaku en Dokploy: una sola imagen (PWA + API + SQLite). Sin Traefik ni puertos publicados: el proxy y HTTPS los
# pone Dokploy. Dominio en Dokploy → Domains: servicio «yaku», host yaku.lat (y www.yaku.lat), Container Port 8080,
# HTTPS con Let's Encrypt. Variables en Dokploy → Environment (plantilla: yaku.env.ejemplo).
services:
  yaku:
    build: .
    image: yaku:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      MUNI_PIN: ${MUNI_PIN:?Define MUNI_PIN en Dokploy → Environment}
      MUNI_USUARIO: ${MUNI_USUARIO:-central}
      MUNI_CLAVE: ${MUNI_CLAVE:-}
      MUNI_NOMBRE: ${MUNI_NOMBRE:-Municipio central}
      YAKU_SESION_HORAS: ${YAKU_SESION_HORAS:-72}
      YAKU_MODO_ESTRICTO: ${YAKU_MODO_ESTRICTO:-0}
      PORT: "8080"
      YAKU_DATOS: /datos
    volumes:
      - yaku-datos:/datos
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  yaku-datos:
