<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Enlaces viejos (/?vista=…, /#p=…) → ruta nueva antes de pintar nada. El servidor ya redirige /?vista=;
       esto cubre el hash y la copia de la PWA sin red. Misma tabla que redireccionRuta() en src/rutas.ts. No quitar. -->
  <script>
    (function (l) {
      var q = new URLSearchParams(l.search), v = q.get('vista'), d = '/app';
      if (v === null) { if (/^#p=/.test(l.hash)) l.replace('/app' + l.search + l.hash); return; }
      if (v === 'poblador') { d = '/reportar'; q.delete('vista'); }
      else if (v === 'municipalidad' || v === 'incidentes') { d = '/municipalidad'; q.delete('vista'); }
      else if (v === 'portal') d = '/municipalidad';
      else if (v === '2d' || v === '') q.delete('vista');
      var r = q.toString();
      l.replace(d + (r ? '?' + r : '') + l.hash);
    })(location);
  </script>
  <meta name="theme-color" content="#0b141b" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- Título, descripción, Open Graph, fuentes precargadas y JSON-LD: src/landing/plantilla.ts (desde contenido.ts). -->
  <!--yaku:head-->
</head>
<body>
  <!-- Cuerpo de la landing: lo escribe src/landing/plugin.ts a partir de src/landing/contenido.ts. -->
  <!--yaku:cuerpo-->
  <script type="module" src="/src/landing/main.ts"></script>
</body>
</html>
